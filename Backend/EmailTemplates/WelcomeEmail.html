<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bine ai venit!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            padding: 40px 20px;
            background-color: #f9fafb;
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .header {
            padding: 30px 40px;
            border-bottom: 1px solid #f3f4f6;
        }

        .logo-icon {
            color: #3b82f6;
            font-size: 24px;
            font-weight: bold;
            margin-right: 5px;
        }

        .logo-text {
            color: #111827;
            font-size: 20px;
            font-weight: 800;
        }

        .body {
            padding: 40px;
        }

        h1 {
            margin: 0 0 16px 0;
            color: #111827;
            font-size: 28px;
        }

        .text-gradient {
            color: #3b82f6;
        }
        p {
            margin: 0 0 24px 0;
            color: #4b5563;
            font-size: 16px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3b82f6;
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
        }

        .footer {
            padding: 20px 40px;
            background-color: #f9fafb;
            border-top: 1px solid #f3f4f6;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <span class="logo-icon">▲</span><span class="logo-text">PROIECT</span>
            </div>
            <div class="body">
                <h1>Salut, <span class="text-gradient">{{Nume}} {{Prenume}}</span>!</h1>
                <p>Contul tău a fost creat cu succes. Ne bucurăm să te avem alături!</p>
                <div style="text-align: center; margin-bottom: 30px;">
                    <a href="{{LinkConfirmare}}" class="btn" style="color: #ffffff;">Verifica Contul Acum!</a>
                </div>
            </div>
            <div class="footer">
                © {{AnulCurent}} Proiect PPAP. Toate drepturile rezervate.<br>Acesta este un email automat.
            </div>
        </div>
    </div>
</body>
</html>
